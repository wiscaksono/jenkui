name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Built-in linting ships in canary only; stable 1.4.4 has fmt, not lint.
          bun-version: canary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5+; setup-node's bundled npm is older.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run lint
      # OIDC trusted publishing: no token. setup-node's registry-url + the
      # id-token permission let npm authenticate through GitHub's identity.
      # --provenance is required for that OIDC path. --ignore-scripts skips
      # prepublishOnly because every step ran explicitly here.
      - run: npm publish --provenance --access public --ignore-scripts

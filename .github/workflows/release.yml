name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5+; setup-node's bundled npm is older.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # Lint with canary while the built-in linter is not in a stable Bun.
      # Stable Bun still builds and publishes the package.
      - run: npx -y bun@canary lint --no-script --max-warnings=0 src scripts
      # OIDC trusted publishing: no token. setup-node's registry-url + the
      # id-token permission let npm authenticate through GitHub's identity.
      # --provenance is required for that OIDC path. --ignore-scripts skips
      # prepublishOnly (which needs the canary linter) because every step ran here.
      - run: npm publish --provenance --access public --ignore-scripts
